services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dragonatlas3d-pgvector
    environment:
      POSTGRES_DB: dragonatlas3d
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dragonatlas3d"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:

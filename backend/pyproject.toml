[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonatlas3d-backend"
version = "0.1.0"
description = "Wuhan travel-agent backend for DragonAtlas3D"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlmodel>=0.0.24",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[tool.setuptools.packages.find]
include = ["app*"]
